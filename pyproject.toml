[build-system]
requires = ["uv_build>=0.12.21,<0.14"]
build-backend = "uv_build"

[project]
name = "coolguy038_pysh"
version = "0.2.9.1"
authors = [{ name = "Cade", email = "cadey.matignas@gmail.com" }]
description = 'A custom python shell (pronounced like "fysh")'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["termcolor>=2.4.0"]

[project.urls]
Homepage = "https://github.com/cadeymatignas-source/pysh"


[project.scripts]
pysh = "pysh.cli:main"
