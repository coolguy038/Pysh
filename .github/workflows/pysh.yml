name: Build Pysh

on: 
 push:
  tags:
  - "v*"



jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: move pysh win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item src/coolguy038_pysh/pysh.py $env:GITHUB_WORKSPACE
      - name: move pysh lin
        if: runner.os == 'Linux'
        run: |
          mv src/coolguy038_pysh/pysh.py $GITHUB_WORKSPACE
      - name: move pysh mac
        if: runner.os == 'MacOS'
        run: |
          mv src/coolguy038_pysh/pysh.py $GITHUB_WORKSPACE

      - name: Install dependencies
        run: |
          pip install --upgrade pyinstaller termcolor pygments

      - name: Build pysh windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller pysh.py --onefile --icon=logo.ico
      - name: Build pysh macos
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build pysh linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build updater
        run: |
          cd update
          pyinstaller pyshupdate.spec
      - name: Package release archives
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os

          platform = {
              "Windows": "windows",
              "Linux": "linux",
              "macOS": "macos",
          }[os.environ["RUNNER_OS"]]

          output = Path("release-zips")
          output.mkdir(exist_ok=True)

          def add_files(archive, directory, prefix=""):
              directory = Path(directory)
              for file in directory.rglob("*"):
                  if file.is_file():
                      archive.write(file, (Path(prefix) / file.relative_to(directory)).as_posix())

          for source, filename in [
              ("dist", f"pysh-{platform}.zip"),
              ("update/dist", f"pysh-installer-{platform}.zip"),
          ]:
              with ZipFile(output / filename, "w", ZIP_DEFLATED) as archive:
                  add_files(archive, source)

          with ZipFile(output / f"pysh-bundle-{platform}.zip", "w", ZIP_DEFLATED) as archive:
              add_files(archive, "dist", "Pysh")
              add_files(archive, "update/dist", "Installer")
          '@ | python -

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pysh-ZIP-${{ runner.os }}
          path: release-zips/*.zip
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
