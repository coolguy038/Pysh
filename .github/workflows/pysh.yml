name: Build Pysh

on: 
 push:
  tags:
  - "v*"
permissions:
 contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: move pysh win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item src/coolguy038_pysh/pysh.py $env:GITHUB_WORKSPACE
      - name: move pysh lin
        if: runner.os == 'Linux'
        run: |
          mv src/coolguy038_pysh/pysh.py ~$GITHUB_WORKSPACE
      - name: move pysh mac
        if: runner.os == 'MacOS'
        run: |
          mv src/coolguy038_pysh/pysh.py $GITHUB_WORKSPACE

      - name: Install dependencies
        run: |
          pip install --upgrade pyinstaller termcolor pygments

      - name: Build pysh windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller pysh.py --onefile --icon=logo.ico
      - name: Build pysh macos
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build pysh linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --icon=logo.png pysh.py
      - name: Build updater
        run: |
          cd update
          pyinstaller pyshupdate.spec
      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: Pysh-${{ runner.os }}
          path: |
            dist/*
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Installer-${{ runner.os }}
          path: |
            update/dist/*
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pysh-Bundle-${{ runner.os }}
          path: |
            dist/*
            update/dist/*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/**/*
